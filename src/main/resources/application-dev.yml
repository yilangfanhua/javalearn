server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/spring_demo
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 3000ms

logging:
  file:
    name: logs/spring-demo.log
  level:
    root: INFO
    com.example.demo: DEBUG
    org.springframework.security: INFO
    org.mybatis: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET}