server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:0}
    timeout: 3000ms

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
    com.example.demo: INFO
    org.mybatis: WARN

management:
  endpoint:
    health:
      show-details: never